<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>AMEN — Saudi Streetwear | All Misguidance Ends Now</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Big+Shoulders+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- AMEN Styles -->
    <style>
        /* ----------------------------------------
           AMEN — GLOBAL VARIABLES
        ---------------------------------------- */
        :root {
            --color-ink: #000000;
            --color-bone: #F2EFE9;
            --color-sand: #E7E2D8;
            --color-deepgreen: #14532D;
            --color-sun: #B8801A;
            --color-clay: #8C2A1E;
            --color-stone: #6E6A61;
            --color-rule: #CFC8BB;
        }

        /* ----------------------------------------
           BASE TYPOGRAPHY & BODY
        ---------------------------------------- */
        body {
            background-color: var(--color-bone);
            color: var(--color-ink);
            font-family: 'Archivo', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .font-display {
            font-family: 'Big Shoulders Display', sans-serif;
            text-transform: uppercase;
        }

        .arabic {
            font-family: 'Noto Kufi Arabic', sans-serif;
        }

        /* ----------------------------------------
           HERO WORD REVEAL ANIMATION
        ---------------------------------------- */

        /* Each letter (A, M, E, N) */
        .hero-letter {
            display: inline-block;
            opacity: 1;
        }

        /* Each word segment (ll, isguidance, nds, ow) */
        .hero-word {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            vertical-align: bottom;

            /* Start hidden */
            max-width: 0;
            opacity: 0;

            /* Animation */
            animation: revealWord 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Staggered delays */
        .word-delay-1 { animation-delay: 0.1s; }
        .word-delay-2 { animation-delay: 0.2s; }
        .word-delay-3 { animation-delay: 0.3s; }
        .word-delay-4 { animation-delay: 0.4s; }

        /* Reveal animation */
        @keyframes revealWord {
            0% {
                max-width: 0;
                opacity: 0;
                padding-right: 0;
            }
            100% {
                max-width: 300px;
                opacity: 1;
                padding-right: 0.25em;
            }
        }

        /* Ensure animation runs when home view is visible */
        #view-home.block .hero-word {
            animation-play-state: running;
        }

        /* ----------------------------------------
           SCROLLBAR HIDING
        ---------------------------------------- */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ----------------------------------------
           FOCUS RINGS
        ---------------------------------------- */
        *:focus-visible {
            outline: 2.5px solid var(--color-sun);
            outline-offset: 3px;
        }

        /* ----------------------------------------
           CART DRAWER
        ---------------------------------------- */
        #cart-drawer {
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #cart-drawer.open {
            transform: translateX(0);
        }

        #cart-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #cart-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Nav -->
    <nav class="w-full border-b border-[var(--color-rule)] bg-[var(--color-bone)]">
        <div class="max-w-6xl mx-auto flex items-center justify-between px-4 py-3">
            <div class="flex items-center gap-3">
                <span class="font-display text-xl tracking-[0.25em]">A M E N</span>
                <span class="text-xs uppercase tracking-wide text-[var(--color-stone)]">
                    Saudi Streetwear
                </span>
            </div>
            <div class="flex items-center gap-4 text-xs uppercase tracking-wide">
                <button class="hover:underline">Shop</button>
                <button class="hover:underline">Collections</button>
                <button class="hover:underline">About</button>
                <button class="hover:underline">Cart</button>
            </div>
        </div>
    </nav>

    <main id="app-content" class="flex-grow">
        <!-- View: HOME -->
        <div id="view-home" class="block">

            <!-- Hero Section -->
            <section class="relative h-[80vh] md:h-[90vh] bg-ink w-full overflow-hidden flex flex-col justify-end p-5 md:p-11">
                <!-- Background Image -->
                <div class="absolute inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1618354691373-d851c5c3a990?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center"></div>
                <!-- Scrim -->
                <div class="absolute inset-0 z-10 bg-gradient-to-t from-black/90 via-black/50 to-black/20"></div>

                <div class="relative z-20 max-w-[1280px] w-full mx-auto pb-12 md:pb-24">
                    <h1 class="font-display font-black text-[58px] md:text-[132px] leading-[0.88] md:leading-[0.82] text-bone tracking-tight mb-6 flex flex-col">
                        <span>
                            <span class="hero-letter">A</span>
                            <span class="hero-word word-delay-1 lowercase">ll</span>
                        </span>
                        <span>
                            <span class="hero-letter">M</span>
                            <span class="hero-word word-delay-2 lowercase">isguidance</span>
                        </span>
                        <span>
                            <span class="hero-letter">E</span>
                            <span class="hero-word word-delay-3 lowercase">
